name: Finance Notification Agent

on:
  schedule:
    # Fires every 30 minutes (at :00 and :30). The script itself decides
    # whether a check is actually "due" based on finance-agent/config.json's
    # interval setting (halfhour / hourly / daily), so this one cron covers
    # all three modes.
    - cron: "0,30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: finance-agent
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run price/news check
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: python3 finance-agent/scripts/check_prices.py

      - name: Commit updated report/history
        run: |
          git config user.name "finance-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add finance-agent/data/
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Finance agent: update report $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
